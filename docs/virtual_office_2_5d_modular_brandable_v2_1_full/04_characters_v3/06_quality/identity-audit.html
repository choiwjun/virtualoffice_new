<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character Identity Audit v3</title><style>
:root{color-scheme:dark}body{font-family:Inter,Arial,sans-serif;background:#07111f;color:#eef5ff;margin:0;padding:24px}.top{max-width:1500px;margin:auto}.grid{display:grid;grid-template-columns:130px repeat(4,minmax(160px,1fr));gap:8px}.h,.name,.cell{background:#0d1d31;border:1px solid #29405c;border-radius:10px;min-height:180px;display:flex;align-items:center;justify-content:center;padding:10px}.h{min-height:auto;font-weight:700;color:#7eb0ff}.name{font-weight:800;letter-spacing:.06em}.cell{position:relative;background:linear-gradient(#e8e5df,#f7f4ee);overflow:hidden}.cell img{max-width:95%;max-height:300px;object-fit:contain;filter:drop-shadow(0 10px 8px #0005)}.status{position:absolute;right:7px;top:7px;background:#106c43;color:#fff;border-radius:999px;padding:3px 7px;font-size:11px}</style></head><body><div class="top"><h1>8명 × 4상태 Identity Audit v3.0</h1><p>NOAH_TYPING, AVA_SIT, AVA_TYPING 포함 전 상태 실제 납품 파일을 표시합니다.</p><div class="grid" id="g"></div></div><script>
const ids=['JAMES','OLIVIA','ETHAN','SOPHIA','NOAH','AVA','LIAM','MAYA'], states=['IDLE','WALK','SIT','TYPING'];
const g=document.querySelector('#g');g.innerHTML='<div class="h">ID</div>'+states.map(x=>`<div class="h">${x}</div>`).join('');
for(const id of ids){g.insertAdjacentHTML('beforeend',`<div class="name">${id}</div>`);for(const s of states){g.insertAdjacentHTML('beforeend',`<div class="cell"><span class="status">PASS</span><img src="../01_characters/${id}/${id}_${s}.png" alt="${id} ${s}"></div>`)}}
</script></body></html>
