<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virtual Office 2.5D Modular</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div><strong>Virtual Office</strong><span>2.5D Modular Production</span></div><div class="toolbar"><select id="preset"></select><input id="company" value="ACME" maxlength="28"><input id="subtitle" value="CORPORATION" maxlength="36"><input id="brandColor" type="color" value="#f7faff"><button id="applyBrand">브랜드 적용</button><label class="file">로고 업로드<input id="logoFile" type="file" accept="image/*,.svg"></label><button id="toggleLabels">라벨</button><button id="toggleEdit">편집</button><button id="saveLayout">JSON 저장</button><button id="playDemo">자동 시연</button><button id="fullscreen">전체화면</button></div></header>
<main><aside id="catalog"><h3>모듈 카탈로그</h3><div id="catalogList"></div><p>모듈을 클릭해 추가하고, 무대에서 드래그하세요. 더블클릭하면 삭제됩니다.</p></aside><section id="viewport"><div id="stage"><img id="plate"><div id="brand"><img id="brandImg"><div id="brandText"><b></b><small></small></div></div><div id="moduleLayer"></div><div id="characterLayer"></div><div id="labelLayer"></div><div id="glowLayer"></div><div id="hint">바닥을 클릭하면 캐릭터가 이동합니다</div></div></section></main>
<script src="app.js"></script></body></html>
