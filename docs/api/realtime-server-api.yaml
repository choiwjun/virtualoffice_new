## 동시성 제약 명시 (D22)

| 항목 | 설계 | 도그푸딩 검증 | 비고 |
|------|------|---------|------|
| **동시 접속자** | 100명 | 20명 | 500명 표기 폐기 |
| **좌석 배타성** | 1 seat ↔ 1 player 최대 1명 | 자율좌석 5개 × 20명 테스트 | 동시 점유 거절 |
| **회의실 정원** | 게임서버 메모리 권위 | 1 room × 10명 | capacity 초과 시 입장 거절 |
| **서버 tick** | 20Hz (50ms) | 동일 | E2E p95 <500ms 측정 근거 |
| **근접 메뉴 지연** | <200ms | p95 기준 | Raycast(LOS) 계산 <5ms 포함 |

---

## 성능 수치 및 검증 (D22)

| 메트릭 | 목표 | 측정 방법 | 비고 |
|--------|------|---------|------|
| **아바타 동기화 E2E** | p95 < 500ms | 입력→원격 화면 표시 지연 | WSS + 20Hz tick |
| **근접 메뉴 활성화** | <200ms | 거리 진입→메뉴 표시 | 8항목 검증 포함 |
| **서버 CPU/메모리** | 20명 안정 | Spike S3: GDScript 헤드리스 20명 부하 | PhysicsServer3D 포함 |
| **네트워크 지연** | <50ms | 사내망 가정 | VPN 재택자는 추가 지연 |

