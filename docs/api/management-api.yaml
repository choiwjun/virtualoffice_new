                  detail:
                    type: object
                    properties:
                      category:
                        type: string
                      text:
                        type: string
                      evidence:
                        type: string
                      submitted_at:
                        type: string
                        format: date-time
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /kpi-results/{result_id}/objections/review:
    post:
      tags:
        - KPI 평가 (KPI Result)
      summary: 이의신청 재검토 (관리자 전용)
      x-required-role: admin
      description: reviewing → resolved 전이
      operationId: reviewObjection
      parameters:
        - name: result_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - approved
              properties:
                approved:
                  type: boolean
                  description: 이의신청 승인 여부
                revised_score:
                  type: number
                  description: 승인 시 수정 점수
                admin_note:
                  type: string
                  description: 관리자 검토 의견
      responses:
        '200':
          description: 재검토 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPIResultResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  # ======== ERP 동기화 ========
  /erp-sync/status:
    get:
      tags:
        - ERP 동기화 (ERP Integration)
      summary: ERP 동기화 상태 조회 (관리자 전용)
      x-required-role: admin
      description: |
        매시간 증분 + 매일 00:00 KST 전체 대사 상태

        **정본 참조**: 00-decisions.md D17·D18, 06-screens.md §3.12
      operationId: getERPSyncStatus
      responses:
        '200':
          description: 동기화 상태
          content:
            application/json:
              schema:
                type: object
                properties:
                  incremental_sync:
                    type: object
                    properties:
                      last_run:
                        type: string
                        format: date-time
                      status:
                        type: string
                        enum: ['success', 'failed', 'pending']
                      error_message:
                        type: string
                  full_sync:
                    type: object
                    properties:
                      last_run:
                        type: string
                        format: date-time
                      status:
                        type: string
                      records_synced:
                        type: integer
                  kpi_push:
                    type: object
                    properties:
                      last_run:
                        type: string
                        format: date-time
                      status:
                        type: string
                      pending_count:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /erp/sync:
    post:
      tags:
        - ERP 동기화 (ERP Integration)
      summary: ERP 동기화 수동 트리거 (관리자 전용)
      x-required-role: admin
      description: 실패 또는 지연 시 수동으로 트리거
      operationId: triggerERPSync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sync_type
              properties:
                sync_type:
                  type: string
                  enum: ['incremental', 'full', 'kpi_push']
      responses:
        '202':
          description: 동기화 시작됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                  status:
                    type: string
                    const: 'started'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /erp-sync/failures:
    get:
      tags:
        - ERP 동기화 (ERP Integration)
      summary: ERP 동기화 실패 이력 조회 (관리자 전용)
      x-required-role: admin
      description: 최근 실패 건들 조회
      operationId: getERPSyncFailures
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: 실패 이력 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp:
                          type: string
                          format: date-time
                        sync_type:
                          type: string
                        error_code:
                          type: string
                        error_message:
                          type: string
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  # ======== 감사 로그 ========
  /audit-logs:
    get:
      tags:
        - 감사 로그 (Audit Log)
      summary: 감사 로그 조회 (관리자 전용)
      x-required-role: admin
      description: |
        모든 주요 작업(배포, 점수 조정, 이의신청 등) 기록

        **정본 참조**: 04-data-model.md audit_log
      operationId: listAuditLogs
      parameters:
        - name: action
          in: query
          schema:
            type: string
            description: 필터링 액션 (login, layout_deploy, kpi_adjust, objection_submit 등)
        - name: from_date
          in: query
          schema:
            type: string
            format: date-time
        - name: to_date
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: 감사 로그 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogResponse'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HS256 JWT (FastAPI 발급, 8h 만료)

        Example: `Authorization: Bearer eyJhbGc...`

  schemas:
    # ======== 공통 ========
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: 에러 코드
        message:
          type: string
          description: 에러 메시지
        details:
          type: object
          description: 추가 정보

    # ======== 사용자 ========
    UserResponse:
      type: object
      required:
        - id
        - email
        - name
        - role
      properties:
        id:
          type: string
          format: uuid
          description: ERP user.id
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: ['employee', 'leader', 'admin', 'super_admin']
        position:
          type: string
        erp_team_id:
          type: string
          description: ERP 팀 ID
        manager_id:
          type: string
          description: 보고자 ID
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    UserDetail:
      allOf:
        - $ref: '#/components/schemas/UserResponse'
        - type: object
          properties:
            work_hours:
              type: integer
              description: 일일 근무시간 (분)
            last_synced_at:
              type: string
              format: date-time

    TeamResponse:
      type: object
      required:
        - id
        - erp_team_id
        - name
      properties:
        id:
          type: string
          format: uuid
        erp_team_id:
          type: string
          description: ERP teams.id
        name:
          type: string
        member_count:
          type: integer

    OrgGroup:
      type: object
      required:
        - id
        - name
        - type
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: ['division', 'department', 'part']
        parent_id:
          type: string
          format: uuid
        color:
          type: string
          description: HEX 컬러 (#000000)
        children:
          type: array
          items:
            $ref: '#/components/schemas/OrgGroup'

    # ======== 좌석 ========
    SeatResponse:
      type: object
      required:
        - id
        - floor_id
        - type
        - coords
        - status
      properties:
        id:
          type: string
          format: uuid
        floor_id:
          type: string
          format: uuid
        team_zone_id:
          type: string
          format: uuid
        type:
          type: string
          enum: ['fixed', 'free', 'temp', 'partner']
        assigned_user_id:
          type: string
          description: 배정된 직원 ID (null = 미배정)
        coords:
          type: object
          properties:
            x:
              type: number
            y:
              type: number
            z:
              type: number
        status:
          type: string
          enum: ['available', 'occupied', 'disabled', 'reserved']
        seat_number:
          type: string
          example: "1-A-01"
        created_at:
          type: string
          format: date-time

    CreateSeatRequest:
      type: object
      required:
        - floor_id
        - type
        - coords
      properties:
        floor_id:
          type: string
          format: uuid
        team_zone_id:
          type: string
          format: uuid
        type:
          type: string
          enum: ['fixed', 'free', 'temp', 'partner']
        coords:
          type: object
          required:
            - x
            - y
            - z
          properties:
            x:
              type: number
            y:
              type: number
            z:
              type: number
        seat_number:
          type: string

    UpdateSeatRequest:
      type: object
      properties:
        type:
          type: string
          enum: ['fixed', 'free', 'temp', 'partner']
        status:
          type: string
          enum: ['available', 'occupied', 'disabled', 'reserved']
        team_zone_id:
          type: string
          format: uuid

    SeatAssignmentResponse:
      type: object
      required:
        - id
        - seat_id
        - user_id
        - assigned_at
      properties:
        id:
          type: string
          format: uuid
        seat_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        assigned_at:
          type: string
          format: date-time
        released_at:
          type: string
          format: date-time
        assigned_by:
          type: string
          format: uuid
        reason:
          type: string

    CreateSeatAssignmentRequest:
      type: object
      required:
        - seat_id
        - user_id
      properties:
        seat_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        reason:
          type: string
          description: 배정 사유

    UpdateSeatAssignmentRequest:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        reason:
          type: string

    # ======== 레이아웃 ========
    OfficeLayoutResponse:
      type: object
      required:
        - id
        - office_id
        - floor_id
        - version
        - status
      properties:
        id:
          type: string
          format: uuid
        office_id:
          type: string
          format: uuid
        floor_id:
          type: string
          format: uuid
        version:
          type: integer
        status:
          type: string
          enum: ['draft', 'validated', 'deployed', 'archived']
        created_by:
          type: string
          format: uuid
        validated_by:
          type: string
          format: uuid
        deployed_at:
          type: string
          format: date-time
        deployment_notes:
          type: string
        created_at:
          type: string
          format: date-time

    CreateOfficeLayoutRequest:
      type: object
      required:
        - office_id
        - floor_id
        - json
      properties:
        office_id:
          type: string
          format: uuid
        floor_id:
          type: string
          format: uuid
        json:
          type: object
          description: 레이아웃 JSON (05-office-layout-schema.md 참조)

    UpdateOfficeLayoutRequest:
      type: object
      properties:
        json:
          type: object
          description: 수정된 레이아웃 JSON

    # ======== 회의 ========
    MeetingResponse:
      type: object
      required:
        - id
        - room_id
        - title
        - scheduled_at
        - host_user_id
        - status
      properties:
        id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        scheduled_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        host_user_id:
          type: string
          format: uuid
        status:
          type: string
          enum: ['scheduled', 'in_progress', 'completed', 'cancelled']
        livekit_room:
          type: string
        participant_count:
          type: integer
        created_at:
          type: string
          format: date-time

    MeetingDetail:
      allOf:
        - $ref: '#/components/schemas/MeetingResponse'
        - type: object
          properties:
            recording_url:
              type: string
            participants:
              type: array
              items:
                type: string
                format: uuid

    CreateMeetingRequest:
      type: object
      required:
        - room_id
        - title
        - scheduled_at
      properties:
        room_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        scheduled_at:
          type: string
          format: date-time
        duration_minutes:
          type: integer
        participant_ids:
          type: array
          items:
            type: string
            format: uuid

    UpdateMeetingRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        scheduled_at:
          type: string
          format: date-time
        duration_minutes:
          type: integer

    MeetingParticipantResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum: ['organizer', 'presenter', 'participant']
        invited_at:
          type: string
          format: date-time
        joined_at:
          type: string
          format: date-time
        left_at:
          type: string
          format: date-time

    # ======== 회의록 ========
    MeetingMinuteResponse:
      type: object
      required:
        - id
        - meeting_id
        - status
      properties:
        id:
          type: string
          format: uuid
        meeting_id:
          type: string
          format: uuid
        title:
          type: string
        summary:
          type: string
        status:
          type: string
          enum: ['draft', 'finalized']
        created_by:
          type: string
          format: uuid
        reviewed_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    MeetingMinuteDetail:
      allOf:
        - $ref: '#/components/schemas/MeetingMinuteResponse'
        - type: object
          properties:
            decisions:
              type: string
              description: 결정사항 (마크다운)
            action_items_summary:
              type: string
            notes:
              type: string
            attachments:
              type: array
              items:
                type: object
                properties:
                  filename:
                    type: string
                  url:
                    type: string
                  mime_type:
                    type: string

    CreateMeetingMinuteRequest:
      type: object
      required:
        - meeting_id
        - decisions
      properties:
        meeting_id:
          type: string
          format: uuid
        title:
          type: string
        summary:
          type: string
        decisions:
          type: string
        action_items_summary:
          type: string
        notes:
          type: string

    UpdateMeetingMinuteRequest:
      type: object
      properties:
        title:
          type: string
        summary:
          type: string
        decisions:
          type: string
        action_items_summary:
          type: string
        notes:
          type: string

    # ======== 업무기록 ========
    WorkLogResponse:
      type: object
      required:
        - id
        - user_id
        - work_date
        - title
        - status
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        work_date:
          type: string
          format: date
        category:
          type: string
        title:
          type: string
        goal:
          type: string
        status:
          type: string
          enum: ['started', 'completed']
        result_url:
          type: string
        result_description:
          type: string
        next_action:
          type: string
        created_at:
          type: string
          format: date-time

    CreateWorkLogRequest:
      type: object
      required:
        - work_date
        - title
      properties:
        work_date:
          type: string
          format: date
        category:
          type: string
        title:
          type: string
        goal:
          type: string
        related_project:
          type: string
        url:
          type: string
        est_minutes:
          type: integer
        result_url:
          type: string
        result_description:
          type: string
        next_action:
          type: string

    UpdateWorkLogRequest:
      type: object
      properties:
        category:
          type: string
        title:
          type: string
        goal:
          type: string
        status:
          type: string
          enum: ['started', 'completed']
        actual_minutes:
          type: integer
        result_url:
          type: string
        result_description:
          type: string
        next_action:
          type: string

    # ======== KPI ========
    KPIResultResponse:
      type: object
      required:
        - id
        - user_id
        - period_type
        - period_key
        - metric
        - value
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        period_type:
          type: string
          enum: ['daily', 'quarterly']
        period_key:
          type: string
          description: "daily: '2026-07-01', quarterly: '2026-Q3'"
        metric:
          type: string
          enum:
            - work_completed_count
            - work_quality_score
            - minutes_authored_count
            - action_items_completed
            - action_items_ontime_rate
            - report_fidelity_score
            - collaboration_score
            - quarterly_total
        value:
          type: number
          description: 결정론적 코드로 계산된 정량 값
        unit:
          type: string
        ai_draft:
          type: object
          description: AI 서술 초안 (강점/개선/근거, 정량값 제외)
        admin_adjusted_score:
          type: number
        admin_note:
          type: string
        objection_status:
          type: string
          enum: ['none', 'submitted', 'reviewing', 'resolved']
        final_score:
          type: number
        finalized_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    KPIResultDetail:
      allOf:
        - $ref: '#/components/schemas/KPIResultResponse'
        - type: object
          properties:
            ai_model:
              type: string
            ai_draft_generated_at:
              type: string
              format: date-time
            admin_user_id:
              type: string
              format: uuid
            admin_reviewed_at:
              type: string
              format: date-time
            objection_detail:
              type: object
            pushed_to_erp:
              type: boolean
            pushed_at:
              type: string
              format: date-time

    SubmitObjectionRequest:
      type: object
      required:
        - category
        - text
      properties:
        category:
          type: string
          enum: ['calculation_error', 'missing_activity', 'unfair_benchmark']
          description: 이의신청 카테고리
        text:
          type: string
          description: 이의신청 내용
        evidence:
          type: string
          description: 증거 (URL, 파일 등)

    # ======== 감사 로그 ========
    AuditLogResponse:
      type: object
      required:
        - id
        - action
        - user_id
        - timestamp
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          description: 액션 (login, layout_deploy, kpi_adjust 등)
        user_id:
          type: string
          format: uuid
          description: 실행자 ID
        resource_type:
          type: string
          description: 리소스 타입 (meeting, kpi_result 등)
        resource_id:
          type: string
          description: 리소스 ID
        details:
          type: object
          description: 상세 정보
        timestamp:
          type: string
          format: date-time

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 'INVALID_REQUEST'
            message: '요청 파라미터가 유효하지 않습니다.'
            details: {}

    Unauthorized:
      description: 인증 필요
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 'UNAUTHORIZED'
            message: 'JWT 토큰이 필요합니다.'

    Forbidden:
      description: 접근 권한 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 'FORBIDDEN'
            message: '이 작업을 수행할 권한이 없습니다.'
            details:
              required_role: 'admin'
              actual_role: 'employee'

    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 'NOT_FOUND'
            message: '요청한 리소스를 찾을 수 없습니다.'

    ServerError:
      description: 서버 내부 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 'INTERNAL_SERVER_ERROR'
            message: '서버에 오류가 발생했습니다.'

security:
  - BearerAuth: []
