openapi: 3.1.0
info:
  title: Virtual Office 관리·업무·KPI API
  version: 1.1.0
  description: |
    가상오피스 운영 플랫폼의 REST API 명세서

    **정본 참조**:
    - 00-decisions.md: D4(JWT), D10(좌석 배정), D12(레이아웃 검증), D14(KPI 로직), D15(이의신청), D16(kpi_result 스키마), D17(배치 스케줄)
    - 04-data-model.md: 엔티티·metric 어휘사전
    - 06-screens.md: 권한 매트릭스, 이의신청·자율좌석·동기화 콘솔
    - 08-kpi-logic.md: KPI 조회·조정·확정·이의신청 플로우

    **인증**:
    - 사용자: Bearer Token (JWT, HS256, 자체 시크릿, 8h 만료, 인밴드 refresh)
    - 서비스계정: Bearer Token (서비스 JWT, 24h)

    **권한(RBAC)**:
    - employee: 본인 데이터 조회 및 이의신청 제출만
    - leader: 팀 직원 데이터 조회·관리 (팀 한정)
    - admin: 전체 기능

    ---
    **구현 정합 부록 (v1.1, 2026-07-07 audit)** — 이 명세와 실제 구현(backend/app/api)의 차이. 구현이 정본.

    경로/메서드 드리프트(명세 → 실제):
    - `/users`, `/users/{user_id}` → `/employees`, `/employees/{employee_id}` (페이지네이션 envelope 없이 bare 배열)
    - `PUT /kpi-results/{id}/adjust`, `PUT /kpi-results/{id}/objections/review` → `POST`
    - `PUT /work-logs/{id}`, `PUT /meeting-minutes/{id}`, `PUT /meetings/{id}` → `PATCH`
    - `POST /seat-assignments/{assignment_id}/release` → `.../{seat_id}/release`
    - `/erp-sync/trigger` → `/erp/sync`; `POST /auth/login` 성공 코드 200(명세 201 암묵)

    구현되었으나 이 문서 paths에 미기재(실제 사용 가능):
    - 인증: `GET /auth/me`
    - 직원/ERP: `GET /attendances`, `GET /daily-status-push`, `POST /daily-status-push`, `POST /daily-status-push/{id}/retry`
    - 좌석: `GET /floors`, `POST /seats`, `PUT /seats/{id}`, `DELETE /seats/{id}`, `GET /seat-assignments`, `PUT /seat-assignments/{seat_id}`
    - 조직: `POST /org-groups`, `PUT /org-groups/{id}`, `DELETE /org-groups/{id}`, `POST /org-groups/validate`, `POST /org-groups/deploy`
    - 회의록: `POST/GET /meeting-minutes/{id}/action-items`, `PATCH /meeting-minutes/{id}/action-items/{item_id}`
    - KPI: `GET /kpi-results/{id}/objections`
    - 감사: `GET /audit-logs`
    - 맵: `POST /maps/generate`, `POST /maps/validate`
    - WA: `POST /wa/presence`, `GET /wa/presence/stream`, `POST /wa/livekit-token`
  contact:
    name: Virtual Office 개발팀
  license:
    name: Internal Use Only
  x-logo:
    url: 'https://example.com/logo.png'

servers:
  - url: 'http://localhost:8000/api'
    description: 로컬 개발 환경
  - url: 'http://internal.spacecl.local/api'
    description: 사내 프로덕션

tags:
  - name: 인증 (Authentication)
    description: 로그인, 토큰 갱신, 세션 관리
  - name: 직원·팀 (Employee & Team)
    description: ERP 미러 읽기 (직원, 팀, 조직)
  - name: 좌석 배치 (Seat Assignment)
    description: 좌석 CRUD, 배정 관리, 자율좌석 점유/반납
  - name: 오피스 레이아웃 (Office Layout)
    description: 레이아웃 CRUD, 검증, 배포, 롤백 (층 단위)
  - name: 회의 (Meeting)
    description: 회의 CRUD, 예약, 입장, 참석자 관리
  - name: 회의록 (Meeting Minute)
    description: 회의록 작성, 검토, STT 초안 조회, 확정
  - name: 업무기록 (Work Log)
    description: 업무기록 CRUD, 일일 상태 입력
  - name: KPI 평가 (KPI Result)
    description: KPI 조회, 관리자 조정, 확정, 이의신청
  - name: ERP 동기화 (ERP Integration)
    description: ERP 동기화 상태, 수동 트리거, 실패 이력
  - name: 감사 로그 (Audit Log)
    description: 감사 로그 조회

paths:
  # ======== 인증 ========
  /auth/login:
    post:
      tags:
        - 인증 (Authentication)
      summary: 사용자 로그인
      description: |
        email/password로 로그인하여 JWT 토큰 획득

        **정본 참조**: 00-decisions.md D4, 02-trd-architecture.md §2.2.1
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: ERP 이메일
                password:
                  type: string
                  format: password
                  description: ERP 비밀번호
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Bearer 토큰 (HS256, 8h 만료)
                  refresh_token:
                    type: string
                    description: Refresh 토큰 (7일 만료)
                  user:
                    $ref: '#/components/schemas/UserResponse'
                  expires_in:
                    type: integer
                    description: 토큰 만료시간 (초)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/refresh:
    post:
      tags:
        - 인증 (Authentication)
      summary: JWT 갱신
      description: |
        Refresh 토큰으로 새로운 JWT 획득 (인밴드 refresh용)

        **정본 참조**: 02-trd-architecture.md §2.2.1 (만료 임박 시 자동 갱신)
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  description: 갱신용 토큰
      responses:
        '200':
          description: 토큰 갱신 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  refresh_token:
                    type: string
                  expires_in:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  # ======== 직원·팀 ========
  /users:
    get:
      tags:
        - 직원·팀 (Employee & Team)
      summary: 직원 목록 조회 (권한 기반 필터링)
      description: |
        **권한 매트릭스** (06-screens.md §3.10):
        - employee: 자신만 조회
        - leader: 소속 팀 직원만 조회
        - admin: 전체 조회

        **정본 참조**: 04-data-model.md §2.1 erp_user
      operationId: listUsers
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: ['employee', 'leader', 'admin']
          description: 역할로 필터링
        - name: is_active
          in: query
          schema:
            type: boolean
          description: 활성 직원만 (soft-delete)
        - name: team_id
          in: query
          schema:
            type: string
            format: uuid
          description: 팀 필터링 (leader의 경우 자동 적용)
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: 직원 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserResponse'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /users/{user_id}:
    get:
      tags:
        - 직원·팀 (Employee & Team)
      summary: 직원 상세 조회
      operationId: getUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ERP user.id
      responses:
        '200':
          description: 직원 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /teams:
    get:
      tags:
        - 직원·팀 (Employee & Team)
      summary: 팀 목록 조회
      description: ERP teams 미러 읽기
      operationId: listTeams
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: 팀 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TeamResponse'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /org-groups:
    get:
      tags:
        - 직원·팀 (Employee & Team)
      summary: 조직 그룹 조회
      description: 계층 구조 포함
      operationId: listOrgGroups
      responses:
        '200':
          description: 조직 그룹 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrgGroup'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  # ======== 좌석 배치 ========
  /seats:
    get:
      tags:
        - 좌석 배치 (Seat Assignment)
      summary: 좌석 목록 조회
      description: 층별, 상태별 필터링 지원
      operationId: listSeats
      parameters:
        - name: floor_id
          in: query
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            type: string
            enum: ['fixed', 'free', 'temp', 'partner']
        - name: status
          in: query
          schema:
            type: string
            enum: ['available', 'occupied', 'disabled', 'reserved']
      responses:
        '200':
          description: 좌석 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SeatResponse'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags:
        - 좌석 배치 (Seat Assignment)
      summary: 좌석 생성 (관리자 전용)
      x-required-role: admin
      operationId: createSeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSeatRequest'
      responses:
        '201':
          description: 좌석 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /seats/{seat_id}:
    put:
      tags:
        - 좌석 배치 (Seat Assignment)
      summary: 좌석 수정 (관리자 전용)
      x-required-role: admin
      operationId: updateSeat
      parameters:
        - name: seat_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSeatRequest'
      responses:
        '200':
          description: 좌석 수정됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags:
        - 좌석 배치 (Seat Assignment)
      summary: 좌석 삭제 (관리자 전용)
      x-required-role: admin
      operationId: deleteSeat
      parameters:
        - name: seat_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 좌석 삭제됨
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /seat-assignments:
    get:
      tags:
        - 좌석 배치 (Seat Assignment)
      summary: 좌석 배정 내역 조회
      description: 권한 기반 필터링 적용
      operationId: listSeatAssignments
      parameters:
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: seat_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 배정 내역
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SeatAssignmentResponse'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags:
        - 좌석 배치 (Seat Assignment)
      summary: 좌석 배정 (자율좌석 점유 + 관리자 배정)
      description: |
        - 자율좌석(free): 직원이 자신의 좌석 선택하여 점유
        - 고정좌석(fixed): 관리자가 직원 배정

        **정본 참조**: 04-data-model.md seat, 06-screens.md §3.11
      operationId: createSeatAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSeatAssignmentRequest'
      responses:
        '201':
          description: 배정 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatAssignmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 충돌 (좌석 이미 점유 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'

    put:
      tags:
        - 좌석 배치 (Seat Assignment)
      summary: 좌석 배정 수정 (관리자 전용)
      x-required-role: admin
      operationId: updateSeatAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSeatAssignmentRequest'
      responses:
        '200':
          description: 배정 수정됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatAssignmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /seat-assignments/{seat_id}/release:
    post:
      tags:
        - 좌석 배치 (Seat Assignment)
      summary: 좌석 반납 (자율좌석, 직원 자신 전용)
      description: 자율좌석 점유 직원이 퇴근/오프라인 시 호출
      operationId: releaseSeatAssignment
      parameters:
        - name: seat_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 반납 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatAssignmentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  # ======== 오피스 레이아웃 ========
  /office-layouts:
    get:
      tags:
        - 오피스 레이아웃 (Office Layout)
      summary: 레이아웃 버전 목록 조회
      description: 상태별 필터링 (draft, validated, deployed)
      operationId: listOfficeLayouts
      parameters:
        - name: office_id
          in: query
          schema:
            type: string
            format: uuid
        - name: floor_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: ['draft', 'validated', 'deployed', 'archived']
      responses:
        '200':
          description: 레이아웃 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OfficeLayoutResponse'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags:
        - 오피스 레이아웃 (Office Layout)
      summary: 레이아웃 생성 (관리자 전용)
      x-required-role: admin
      description: |
        신규 레이아웃을 draft 상태로 생성

        **정본 참조**: 04-data-model.md office_layout, 05-office-layout-schema.md
      operationId: createOfficeLayout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOfficeLayoutRequest'
      responses:
        '201':
          description: 레이아웃 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficeLayoutResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /office-layouts/{layout_id}:
    put:
      tags:
        - 오피스 레이아웃 (Office Layout)
      summary: 레이아웃 수정 (draft 상태, 관리자 전용)
      x-required-role: admin
      operationId: updateOfficeLayout
      parameters:
        - name: layout_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOfficeLayoutRequest'
      responses:
        '200':
          description: 레이아웃 수정됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficeLayoutResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 상태 전이 오류 (draft 상태만 수정 가능)
        '500':
          $ref: '#/components/responses/ServerError'

  /office-layouts/{layout_id}/validate:
    post:
      tags:
        - 오피스 레이아웃 (Office Layout)
      summary: 레이아웃 검증 (draft→validated, 관리자 전용)
      x-required-role: admin
      description: |
        서버 단일 정밀 검증 (도달성 A* 포함)
        ERROR 반환 시 배포 불가, WARNING만 무시 가능

        **정본 참조**: 00-decisions.md D12
      operationId: validateOfficeLayout
      parameters:
        - name: layout_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 검증 완료 (WARNING 포함 가능)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: ['validated', 'warning']
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        level:
                          type: string
                          enum: ['error', 'warning']
                        message:
                          type: string
                        path:
                          type: string
