<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    html, body { margin: 0; background: #EDEAE3; }
    a { color: #33415E; } a:hover { color: #2E7BFF; }
  </style>
</helmet>
<div style="width: 100%; background: #EDEAE3;" data-screen-label="HORIZON Office Scene">
  <x-import component-from-global-scope="horizon-scene" from="./horizon-scene.js" overlay="{{ overlay }}" grain="{{ grain }}" hint-size="100%,100%"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1672, &quot;height&quot;: 941 },
  &quot;qaOverlay&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;검수&quot; },
  &quot;filmGrain&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;렌더&quot; }
}">
class Component extends DCLogic {
  renderVals() {
    return {
      overlay: String(this.props.qaOverlay ?? false),
      grain: String(this.props.filmGrain ?? true)
    };
  }
}
</script>
</body>
</html>
