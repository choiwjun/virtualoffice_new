# 가상오피스 운영 플랫폼 — 사내 로컬 서버 PC 배포 (Docker Compose)
#
# 배포 대상: 사내 온프렘 로컬 서버 PC (단일 조직 도그푸딩, K8s 미사용)
# 기준: D21-r (서버 PC 1대, Caddy + Let's Encrypt, VPN 없음)
#        D29/D30 (2.5D 웹임베드 — WorkAdventure/D26 스택 전면 폐기, 2026-07-17 재작성)
#
# 서비스 구성(단일 통합 스택):
#   db(PostgreSQL) + backend(FastAPI 도메인 API) + realtime(Colyseus 이동서버)
#   + frontend(Next.js 웹콘솔·2.5D 뷰포트) + livekit(회의 SFU) + coturn(TURN 폴백)
#   + caddy(TLS 종단·라우팅)
#
# ⚠️ 오픈 전 필수(spec-gap-audit P0/P1): .env에 강한 시크릿 주입 —
#   JWT_SECRET_KEY / INTERNAL_API_TOKEN / LIVEKIT_API_KEY / LIVEKIT_API_SECRET /
#   INTEGRATION_ENCRYPTION_KEY (Fernet 32B) / COTURN_STATIC_SECRET.
#   ENVIRONMENT=production 이면 backend/realtime가 dev 기본 시크릿 기동을 거부(fail-fast).
#
# 사용:
#   cp .env.example .env   # 시크릿·도메인·키 설정
#   $EDITOR config/coturn.conf     # REPLACE_WITH_COTURN_STATIC_SECRET 교체
#   docker compose up -d --build
#   curl https://${APP_DOMAIN}/login

services:

  # ── PostgreSQL 데이터베이스 ────────────────────────────────────────
  db:
    image: postgres:17
    container_name: vo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-virtualoffice}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 외부 공개 서버(VPN 없음) → DB는 localhost에만 바인딩.
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-virtualoffice}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI 백엔드 (ERP 동기화·presence·KPI·회의·레이아웃 도메인 API) ──
  backend:
    build: ./backend
    container_name: vo_backend
    restart: unless-stopped
    # /ready = DB까지 확인하는 readiness. /health(liveness)를 쓰면 DB가 끊겨도 healthy로
    # 보고돼 프록시가 계속 트래픽을 보낸다.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-virtualoffice}
      ERP_DATABASE_URL: ${ERP_DATABASE_URL:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AUTO_CREATE_TABLES: ${AUTO_CREATE_TABLES:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://office.example.com"]}
      # 보안 시크릿(P1) — production은 강한 값 필수(미주입 시 fail-fast)
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-secret-CHANGE-IN-PRODUCTION}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token-CHANGE-IN-PRODUCTION}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      # 로그인 rate-limit: Caddy가 1차 차단하므로 앱은 프록시 IP 헤더 신뢰(P1-2)
      TRUST_PROXY_IP_HEADER: ${TRUST_PROXY_IP_HEADER:-true}
      LOGIN_RATE_LIMIT_PER_MIN: ${LOGIN_RATE_LIMIT_PER_MIN:-10}
      # LiveKit 자격증명 (회의 토큰 발급 — /api/meetings/{id}/livekit-token)
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret01234567890123456789012345}
      LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL:-http://livekit:7880}
    expose:
      - "8000"

  # ── Colyseus 실시간 이동서버 (20Hz tick, presence write, D3/D29) ──
  realtime:
    build: ./realtime
    container_name: vo_realtime
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: ${ENVIRONMENT:-development}
      PORT: "2567"
      # 클라 씬 정본(D35 V3)과 같은 층이어야 좌표가 어긋나지 않는다. horizon은 구 legacy 값.
      SCENE_FLOOR: ${SCENE_FLOOR:-v3}
      # 무인증 join 금지(P1-4) — production에서 false면 기동 거부
      JWT_REQUIRED: ${JWT_REQUIRED:-true}
      JWT_SECRET: ${JWT_SECRET_KEY:-dev-only-secret-CHANGE-IN-PRODUCTION}
      # presence write / floor-layout 조회 — backend 내부 API(내부 토큰 일치 필수)
      PRESENCE_SINK_URL: http://backend:8000
      LAYOUT_SOURCE_URL: http://backend:8000
      PRESENCE_SINK_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token-CHANGE-IN-PRODUCTION}
    expose:
      - "2567"

  # ── Next.js 웹콘솔 (통합 대시보드 + 2.5D 뷰포트, D29) ──────────────
  # NEXT_PUBLIC_* 는 빌드타임 각인 → build.args로 공개 URL 주입.
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${APP_PUBLIC_URL:-https://office.example.com}
        NEXT_PUBLIC_REALTIME_URL: ${REALTIME_PUBLIC_URL:-wss://realtime.office.example.com}
    container_name: vo_frontend
    restart: unless-stopped
    depends_on:
      - backend
      - realtime
    expose:
      - "3000"

  # ── LiveKit SFU — 회의 화상/음성 (D24) ──────────────────────────
  livekit:
    image: livekit/livekit-server:v1.7.2
    container_name: vo_livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret01234567890123456789012345}"
    ports:
      - "127.0.0.1:7880:7880"     # HTTP/WS — Caddy가 ${LIVEKIT_DOMAIN}으로 프록시
      - "7881:7881/tcp"           # RTC TCP 폴백
      - "50000-50200:50000-50200/udp"  # RTC UDP (방화벽 개방 필요, D21-r §3.2)
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml:ro

  # ── coturn TURN 서버 — WebRTC 릴레이 (D21-r TURN-TLS 폴백) ────────
  # ⚠️ 배포 전 config/coturn.conf의 REPLACE_WITH_COTURN_STATIC_SECRET 교체 필수
  coturn:
    image: coturn/coturn:4.6.2
    container_name: vo_coturn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
    volumes:
      - ./config/coturn.conf:/etc/coturn/turnserver.conf:ro
      - caddy_data:/caddy_data:ro

  # ── Caddy 역방향 프록시 — TLS 종단 + frontend/backend/realtime/livekit 라우팅 ──
  caddy:
    image: caddy:2-alpine
    container_name: vo_caddy
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP (ACME challenge + HTTPS 리다이렉트)
      - "443:443"   # HTTPS + WSS
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN}            # 웹콘솔 + /api/* (backend)
      REALTIME_DOMAIN: ${REALTIME_DOMAIN}  # Colyseus WS
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN}    # LiveKit SFU
      ACME_EMAIL: ${ACME_EMAIL}
    depends_on:
      - frontend
      - backend
      - realtime
      - livekit

volumes:
  pgdata:
  caddy_data:
  caddy_config:
