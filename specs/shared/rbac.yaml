version: "2.0"

# 권한 규칙 & 접근 매트릭스 (RBAC)
# 정본: 06-screens.md §3.10. 역할 = erp_user.role (employee | leader | admin | super_admin)
# 실제 권한 검사는 애플리케이션 레이어에서 role + 팀 소속(user_team_history)으로 수행(04 §4)
# 작성일: 2026-07-02

roles:
  - employee # 일반 직원
  - leader # 팀/부서 리더 (팀 한정 열람 권한)
  - admin # 회사 관리자
  - super_admin # 최상위 관리자 — admin 상위 호환(아래 매트릭스의 admin 열 포함). role 어휘 정본 = 04 §2.1

access_matrix:
  # 화면/기능 × 역할. scope 표기: team = 본인 팀 한정, self = 본인 데이터 한정
  - feature: 3D 오피스(입장·이동·프레즌스)
    screen: screen-virtual-office-3d
    employee: allow
    leader: allow
    admin: allow

  - feature: 본인 KPI 조회 (/kpi)
    screen: screen-kpi-dashboard
    employee: allow (scope=self)
    leader: allow (scope=self)
    admin: allow

  - feature: 팀 KPI 순위/타인 점수 열람 (/admin/kpi)
    screen: screen-kpi-dashboard
    employee: deny
    leader: allow (scope=team)
    admin: allow

  - feature: KPI 워크플로우 화면 진입 (/admin/kpi/workflow — 검토·조정·확정)
    screen: screen-kpi-workflow
    employee: deny # 직원 본인 분기 열람은 /kpi/quarterly (read-only)
    leader: allow (scope=team)
    admin: allow

  - feature: KPI 점수 조정 (admin_adjusted_score ±10%)
    screen: screen-kpi-workflow
    employee: deny
    leader: allow (scope=team) # 자기 팀 범위 한정 — 정본 08-kpi-logic §3.2·§7.1
    admin: allow

  - feature: KPI 최종 확정 (final_score/finalized_at)
    screen: screen-kpi-workflow
    employee: deny
    leader: deny # 확정은 admin 전용 — 정본 08-kpi-logic §7.1
    admin: allow

  - feature: 이의신청 제출
    screen: screen-kpi-objection
    employee: allow (scope=self)
    leader: allow (scope=self)
    admin: allow

  - feature: 이의신청 재검토·확정
    screen: screen-kpi-objection
    employee: deny
    leader: deny
    admin: allow

  - feature: 좌석 배치 편집기(구조 편집·배포)
    screen: screen-seat-layout-editor
    employee: deny
    leader: deny
    admin: allow

  - feature: 조직도 편집
    screen: screen-org-chart-editor
    employee: deny
    leader: deny
    admin: allow

  - feature: 직원명부 조회
    screen: screen-employee-directory
    employee: allow
    leader: allow
    admin: allow

  - feature: 회의/회의록·업무기록
    screen: [screen-meetings, screen-work-log]
    employee: allow (회의록 수정은 host 한정)
    leader: allow
    admin: allow

  - feature: 동기화 모니터링 콘솔
    screen: screen-sync-monitoring
    employee: deny
    leader: deny
    admin: allow

  - feature: 공지사항 열람
    screen: screen-announcement
    employee: allow
    leader: allow
    admin: allow

  - feature: 공지사항 작성·수정·삭제
    screen: screen-announcement
    employee: deny
    leader: deny
    admin: allow # admin·super_admin 전용(04 §2.7)

  # ── 2026-07-13 확장: 구현 선행 기능 등재 (spec-impl-gap-audit-2026-07-13 §5-4) ──

  - feature: 출장관리 (신청·조회 self / 승인·반려)
    screen: screen-trip # 06 §3.15
    employee: allow (scope=self)
    leader: allow (승인·반려 + 조회 scope=team↑) # trips.py ADMIN_ROLES
    admin: allow

  - feature: 보고서 (작성·조회 self / 전체 조회)
    screen: screen-reports # 06 §3.16
    employee: allow (scope=self)
    leader: allow (조회 scope=team↑) # reports.py ADMIN_ROLES
    admin: allow

  - feature: 커뮤니케이션 채널 채팅 (general/team)
    screen: screen-chat # 06 §3.17 — 본격 채팅은 Phase 7
    employee: allow (general + 본인 팀 채널)
    leader: allow (general + 본인 팀 채널)
    admin: allow # 전 채널

  - feature: 아바타 커스터마이징
    screen: screen-settings # 06 §3.9
    employee: allow (scope=self)
    leader: allow (scope=self)
    admin: allow (scope=self)

  - feature: 녹음/STT 동의 (제출·본인 상태 조회)
    screen: screen-meetings # D20-b
    employee: allow (scope=self)
    leader: allow (scope=self)
    admin: allow # 회의 단위 동의 현황 조회 포함

  - feature: 감사 로그 조회
    screen: screen-audit-log
    employee: deny
    leader: deny
    admin: allow

  - feature: 근태 조회 / EOD push 트리거
    screen: screen-sync-monitoring # D17
    employee: allow (근태 scope=self, EOD 본인 큐잉만)
    leader: allow (근태 scope=self)
    admin: allow # 전체 근태 + EOD run 트리거

  - feature: 좌석 배정 이력 조회 (관리)
    screen: screen-seat-layout-editor
    employee: deny
    leader: deny # 좌석 편집기와 동일 집합 (seats.py ADMIN_ROLES, 2026-07-13 정합)
    admin: allow

unauthorized_screen:
  # 권한 없는 접근 시 공통 표시(06 §3.10)
  message: "🔒 접근 권한이 없습니다 — 이 화면은 관리자 전용입니다."
  actions: ["[이전으로]", "[권한 요청]"]

notes:
  - 각 화면 YAML의 screen.required_role은 최소 진입 역할이며, 세부 기능 경계는 본 매트릭스가 정본
  - leader의 team 범위 판정은 erp_user.erp_team_id + user_team_history(기간 평가 시) 기준
