version: "2.0"

# 화면 인덱스
# 가상오피스 플랫폼의 모든 화면 목록 및 메타데이터
# 작성일: 2026-07-02

screens:
  - id: screen-virtual-office-3d
    file: virtual-office-3d.yaml
    name: 3D Main Office
    route: "/" # 기본 진입점 (Godot 데스크톱)
    platform: godot-native
    layout: split-3d-hud
    description: |
      가상오피스 3D 공간. 실시간 아바타 이동, 회의실 입장, 팀 구역 시각화, 좌측 사이드바(층/구역/사람),
      우측 참석자 패널, 하단 회의/업무 제어. Godot 4 네이티브 데스크톱 앱.

  - id: screen-org-chart-editor
    file: org-chart-editor.yaml
    name: 조직도 편집기
    route: /admin/org-chart
    platform: web
    layout: sidebar-main
    description: |
      ERP teams + org_group 계층 시각화 및 편집. React Flow 노드 그래프로 본부/부서/파트/팀 구조 관리.
      검증(순환참조, 미매핑), 배포, 미리보기 기능.

  - id: screen-employee-directory
    file: employee-directory.yaml
    name: 직원명부
    route: /admin/employees
    platform: web
    layout: sidebar-main
    description: |
      ERP 직원 정보의 읽기전용 목록. 팀/상태 필터, 검색, CSV 내보내기, 상세 슬라이드 패널.
      마지막 동기화 시각 표시. 모바일 대응 카드 레이아웃.

  - id: screen-seat-layout-editor
    file: seat-layout-editor.yaml
    name: 좌석 배치 편집기
    route: /admin/office-layout
    platform: web
    layout: sidebar-main
    description: |
      2D Konva.js 평면도 전용(웹 3D 미리보기 없음 — D11). 벽, 좌석, 회의실, 문 개구부, 구역 배치.
      정밀 3D 확인은 저장 후 [데스크톱에서 열기(draft)]로 Godot 데스크톱 클라이언트에서 수행.
      Undo/Redo, 서버 검증(D12: ERROR 배포 차단), 층 단위 버전 관리, 배포/롤백.

  - id: screen-kpi-dashboard
    file: kpi-dashboard.yaml
    name: KPI 대시보드
    route: /admin/kpi # 라우팅 분리: /kpi = 본인 KPI 열람(전 역할), /admin/kpi = 관리자 검토·확정(leader 팀 한정/admin)
    platform: web
    layout: sidebar-main
    description: |
      KPI 평가 결과 조회/검토. AI 초안 표시, 관리자 조정·확정(final_score), ERP 푸시 상태 추적.
      기간별 필터, 팀 종합, 개인 지표, 추이/비교/순위 탭. 본인용(/kpi)과 관리자용(/admin/kpi) 라우팅 분리.

  - id: screen-meetings
    file: meetings.yaml
    name: 회의 & 회의록 관리
    route: /meetings
    platform: web
    layout: sidebar-main
    description: |
      회의 일정(일간/주간/월간 캘린더), 회의 상세정보, 참석자 목록.
      회의록(결정사항/액션아이템/노트) 작성, 액션아이템 대시보드.

  - id: screen-work-log
    file: work-log.yaml
    name: 업무기록
    route: /work-log
    platform: web
    layout: sidebar-main
    description: |
      일별 업무 기록, 범주/시간/결과물/이슈 추적. 일일 상태 리포트 작성.
      기간별 요약(일간/주간/월간/연간), 카테고리 분포, ERP 동기화.

  - id: screen-auth
    file: auth.yaml
    name: 로그인 / 세션 (Auth)
    route: /login
    platform: web
    layout: centered
    description: |
      FastAPI 자체 JWT(HS256) 로그인(D4). 401 실패, 세션 만료·토큰 갱신, 임시 저장 복구.
      로그인 성공 시 직원명부로 랜딩(웹 콘솔 랜딩 = 직원명부, 2026-07-02 결정).

  - id: screen-kpi-objection
    file: kpi-objection.yaml
    name: KPI 이의신청
    route: /kpi/objection # 관리자 재검토 뷰는 /admin/kpi/objections
    platform: web
    layout: sidebar-main
    description: |
      직원 이의신청 제출(사유 필수, 7일 창) + 관리자 재검토·확정 뷰.
      상태머신 none→submitted→reviewing→resolved(D15). 확정 시 final_score ERP 재push.

  - id: screen-sync-monitoring
    file: sync-monitoring.yaml
    name: 동기화 모니터링 콘솔
    route: /admin/sync
    platform: web
    layout: sidebar-main
    description: |
      ERP 동기화·EOD push·KPI 배치의 상태 테이블/실패 이력/수동 재시도(관리자 전용, 06 §3.12).
      erp_sync_log + daily_status_push(run_id, error_message) 기반.

metadata:
  total_screens: 10
  web_screens: 9
  native_screens: 1
  admin_routes: 5 # org-chart, employees, office-layout, kpi(admin), sync
  user_routes: 3 # meetings, work-log, kpi/objection (본인 KPI는 /kpi)
  public_routes: 1 # login
  godot_routes: 1 # 3d-office

routing_notes:
  - "KPI 라우팅 분리: /kpi = 본인 KPI 열람(전 역할), /admin/kpi = 관리자 검토·확정 — §3.10 접근 매트릭스(shared/rbac.yaml) 참조"
  - "웹 콘솔 랜딩 = 직원명부(/admin/employees). 별도 대시보드 화면 없음(2026-07-02 결정)"

grouping:
  admin:
    - screen-org-chart-editor
    - screen-employee-directory
    - screen-seat-layout-editor
    - screen-kpi-dashboard
    - screen-sync-monitoring
  user:
    - screen-meetings
    - screen-work-log
    - screen-kpi-objection
  public:
    - screen-auth
  immersive:
    - screen-virtual-office-3d
