version: "2.0"

screen:
  name: KPI 대시보드
  route: /admin/kpi # 열람·추이·팀 종합 전용. 본인 KPI 열람은 /kpi (라우팅 분리). 조정·확정은 /admin/kpi/workflow(kpi-workflow.yaml) 소관
  platform: web
  layout: sidebar-main
  required_role: employee # 본인 KPI(/kpi)는 전 역할, 팀 순위·타인 점수 열람(/admin/kpi)은 leader(팀 한정)/admin — §3.10. 조정·확정은 kpi-workflow 소관

data_requirements:
  - resource: kpi_result
    needs: [id, user_id, period_type, period_key, metric, value, unit, source, ai_draft, ai_draft_generated_at, ai_model, admin_adjusted_score, admin_note, admin_user_id, admin_reviewed_at, objection_status, final_score, finalized_at, pushed_to_erp, pushed_at]
    filters:
      period_type: "?period_type"
      period_key: "?period_key"
      user_id: "?user_id"
    mutations: [update]
    access: read-write

  - resource: work_log
    needs: [id, user_id, work_date, status, result_url, result_description, category, title]
    filters:
      user_id: "?user_id"
      work_date: "?date_range"
    access: read-only

  - resource: meeting
    needs: [id, host_user_id, started_at, ended_at, title, status]
    filters:
      host_user_id: "?user_id"
    access: read-only

  - resource: meeting_minute
    needs: [id, meeting_id, decisions, action_items_summary, created_at]
    access: read-only

  - resource: action_item
    needs: [id, meeting_id, assignee_user_id, status, completed_at, due_date]
    access: read-only

  - resource: erp_user
    needs: [id, name, email, position, erp_team_id]
    filters:
      id: "?user_id"
    access: read-only

  - resource: daily_status_push
    needs: [id, user_id, push_date, target, payload, status, pushed_at, retry_count]
    mutations: [create]
    access: read-write

components:
  - id: header-controls
    type: toolbar
    position: top
    function: 기간 선택(daily/quarterly), 팀 필터, 비교 보기, 내보내기 버튼

  - id: period-selector
    type: panel
    position: top
    function: 기간 선택 (daily/quarterly 선택기, 날짜 range picker — weekly/월별 주기 폐기 D16)

  - id: my-kpi-section
    type: panel
    position: main
    function: 개인 KPI 카드 (지표 종합, AI 초안, 검토 상태 표시 — 조정·확정 UI 없음)
    data_source:
      resource: kpi_result

  - id: metric-progress-bars
    type: chart
    position: main
    function: "지표 표시(08 §1.2/04 §2.5 정본) — collaboration_score 게이지(헤드라인) + 지표바 5종(work_completed_count, work_quality_score, minutes_authored_count, action_items_ontime_rate, report_fidelity_score)"
    data_source:
      resource: kpi_result

  - id: ai-draft-display
    type: panel
    position: main
    function: AI 평가 초안 (강점, 개선점, 액션 제안)
    data_source:
      resource: kpi_result

  # (제거) admin-review-controls — 조정·확정은 kpi-workflow(/admin/kpi/workflow) 소관. 본 화면은 열람·추이·팀 종합 전용

  - id: team-summary-section
    type: panel
    position: main
    function: 팀 종합 KPI (평균점수, 팀 구성원 순위, 상위 5명 리스트)
    data_source:
      resource: kpi_result

  - id: tab-navigation
    type: toolbar
    position: main
    function: 탭 네비게이션 ([추이][비교][팀랭킹][개선액션])

  - id: status-badge
    type: badge
    position: main
    function: 검토 상태 배지 (admin_reviewed_at 유무 + finalized_at 유무 + objection_status로 판정)

  - id: erp-push-indicator
    type: badge
    position: main
    function: ERP 동기화 상태 (pushed_to_erp, pushed_at timestamp 표시)

events:
  - on: period_selected
    do: 필터링 조건 변경, kpi_result 재로드

  # (제거) admin_review_submitted — 조정·확정 이벤트는 kpi-workflow(/admin/kpi/workflow) 소관

  - on: ai_draft_not_found
    do: 에러 모달 표시 (재시도/수동입력 옵션)

  - on: erp_push_initiated
    do: daily_status_push 레코드 생성 (target=erp_kpi_results, status=pending)

tests:
  - name: "정상 흐름 - KPI 조회 및 AI 초안 표시"
    when: "사용자가 기간을 선택하고 대시보드 로드"
    then:
      - "kpi_result 데이터가 로드됨 (선택한 period_type + period_key로 필터링)"
      - "metric 별 진행도 바가 value를 반영하여 표시 (색상: 초록/노랑/빨강)"
      - "ai_draft(강점/개선/근거 서술)가 표시되고 ai_draft_generated_at 타임스탐프 표시"
      - "admin_reviewed_at=null이면 [검토중] 배지, finalized_at 설정 시 [확정] 배지"

  - name: "조정·확정 UI 부재 - 워크플로우 화면으로 유도"
    when: "관리자가 본 화면에서 KPI 조정·확정을 시도"
    then:
      - "본 화면에는 조정·확정 컨트롤이 없음 (열람·추이·팀 종합 전용)"
      - "검토·조정·확정은 kpi-workflow(/admin/kpi/workflow) 링크로 이동하여 수행"
      - "상태 배지([검토중]/[승인]/[조정]/[확정])는 읽기 전용 표시만"

  - name: "AI 평가 실패 - 에러 상태 및 복구"
    when: "ai_draft_generated_at가 null이고 화면 로드 시"
    then:
      - "에러 모달 표시: '❌ AI 평가를 생성할 수 없었습니다'"
      - "가능한 원인 및 해결 옵션 표시 ([재시도][수동입력][관리자][취소])"
      - "[수동입력] 선택 시 ai_draft 텍스트 에리어 활성화"
      - "[재시도] 클릭 시 API 호출 재시도"

  - name: "ERP 동기화 상태 추적"
    when: "관리자가 [내보내기] 버튼 클릭하여 ERP 푸시 초기화"
    then:
      - "daily_status_push 레코드 생성 (user_id, push_date, target=erp_kpi_results, status=pending, run_id 부여) — final_score만 전송(D15)"
      - "kpi_result.pushed_to_erp=true, pushed_at 타임스탐프 설정"
      - "erp-push-indicator에 상태 표시 (pending → sent, 또는 failed 시 error_message)"
      - "관리자 확정 이벤트 + 분기 마감 배치로 push (retry_count 추적, D15·D17)"

  - name: "팀 KPI 종합 및 순위 조회"
    when: "사용자가 팀 필터를 선택하고 [팀랭킹] 탭 클릭"
    then:
      - "같은 team_zone의 모든 유저 kpi_result 로드"
      - "팀 평균 collaboration_score 계산 및 team-summary-section에 표시 (quarterly 표시 시 quarterly_total 병기 가능)"
      - "상위 5명을 순위순으로 리스트 (이름, collaboration_score, 주요 지표)"
      - "각 지표별 팀 평균값과 개인값 비교 차트 표시"

notes:
  - "KPI 지표 계산: 21:00 야간 배치(D17)로 자동 수행(결정론적 코드), 데이터 소스 = work_log, meeting, meeting_minute, action_item"
  - "결과중심 원칙: 협업점수·회의생산성 지표는 회의록(decisions)·액션아이템 이행률·완료 업무 기반으로 산출. meeting.started_at/ended_at은 표시·맥락용이며 접속시간·참석횟수를 KPI 산식에 반영하지 않음(반감시)."
  - "AI 초안 생성: 21:00 야간 배치(D17)에서 Claude API 호출(서술만 — 정량 점수는 결정론적 코드, D14-e), ai_draft_generated_at 기록, 실패 시 ai_draft=null"
  - "조정·확정은 kpi-workflow(/admin/kpi/workflow) 소관 — 본 화면은 열람·추이·팀 종합 전용. 상태 배지 판정용으로 admin_reviewed_at·finalized_at·admin_adjusted_score IS NOT NULL(D16)만 읽는다"
  - "ERP 푸시: 관리자 확정 이벤트 + 분기 마감 배치(D15·D17), daily_status_push 로그 생성(final_score만 전송)"
  - "이의신청: objection_status(none→submitted→reviewing→resolved)는 kpi-objection.yaml 화면에서 처리, 본 화면은 상태 표시만"
  - "지표 정의 문서: 06-screens.md §3.4의 지표 상세 참조"

open_questions:
  - "팀 필터 기준: org_group (상위 조직)을 사용할지, team_zone (물리적 구역)을 사용할지? (벤치마크는 user_team_history 기준 — 04 §2.3)"
  - "AI 초안 재시도 정책: 몇 초 후 몇 회까지 자동 재시도할지?"
  - "복수 관리자인 경우 검토 workflow: sequential vs parallel?"
  - "메트릭 weight 변경: hardcoded(완료도×30%...)인지 UI에서 조정 가능한지?"
