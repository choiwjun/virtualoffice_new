version: "2.0"

screen:
  name: 좌석 배치 편집기
  route: /admin/office-layout
  platform: web
  layout: sidebar-main
  required_role: admin # §3.10 접근 매트릭스 — 구조 편집·배포는 관리자 전용

data_requirements:
  - resource: office
    needs: [id, name]
    filters:
      company_id: "?company_id"
    access: read-only

  - resource: floor
    needs: [id, level, name, minimap_config]
    filters:
      office_id: "?office_id"
    access: read-only

  - resource: office_layout
    needs: [id, office_id, floor_id, version, status, json, created_by, validated_by, deployment_notes]
    filters:
      office_id: "?office_id"
      floor_id: "?floor_id"
    mutations: [create, update]
    access: read-write

  - resource: seat
    needs: [id, floor_id, team_zone_id, type, coords, status, assigned_user_id, seat_number]
    filters:
      floor_id: "?floor_id"
    mutations: [create, update, delete]
    access: read-write

  - resource: room
    needs: [id, floor_id, type, name, capacity, coords, enter_trigger, status]
    filters:
      floor_id: "?floor_id"
    mutations: [create, update, delete]
    access: read-write

  - resource: team_zone
    needs: [id, erp_team_id, org_group_id, zone_label, color, polygon, floor_id]
    filters:
      floor_id: "?floor_id"
    mutations: [create, update, delete]
    access: read-write

  - resource: erp_user
    needs: [id, name, email]
    access: read-only

components:
  - id: office-selector
    type: form
    position: top
    function: 오피스 선택 드롭다운
    data_source:
      resource: office

  - id: floor-selector
    type: form
    position: top
    function: 층(floor) 선택 드롭다운
    data_source:
      resource: floor

  - id: toolbar-undo-redo
    type: toolbar
    position: top
    function: Undo/Redo 버튼

  - id: button-open-desktop-draft
    type: toolbar
    position: top
    function: "[데스크톱에서 열기(draft)] — 저장된 draft layout을 Godot 데스크톱 클라이언트 draft 모드로 열람(웹 3D 미리보기 없음 — D11)"

  - id: button-save
    type: toolbar
    position: top
    function: 변경사항 저장

  - id: palette-desk
    type: panel
    position: left
    function: 'Desk 도구: 드래그로 좌석 생성, 회전 가능'

  - id: palette-table
    type: panel
    position: left
    function: 'Table 도구: 탁자 배치'

  - id: palette-chair
    type: panel
    position: left
    function: 'Chair 도구: 의자 배치'

  - id: palette-wall
    type: panel
    position: left
    function: 'Wall 도구: 라인 드래그로 벽 생성'

  - id: palette-door
    type: panel
    position: left
    function: 'Door 도구: 출입문 표시'

  - id: palette-focus-zone
    type: panel
    position: left
    function: 'Focus Zone 도구: 집중 구역 배치'

  - id: palette-zone-paint
    type: panel
    position: left
    function: 'Zone Paint 도구: 다각형 그리기로 구역 생성'

  - id: palette-delete
    type: panel
    position: left
    function: 'Delete 도구: 요소 삭제'

  - id: layers-panel
    type: tree
    position: left
    function: 'Walls, Zones, Seats, Rooms 레이어 표시/숨김 토글'

  - id: team-zones-list
    type: list
    position: left
    function: '팀 구역 목록, 색상 표시, 팀별 할당 현황'

  - id: button-add-zone
    type: form
    position: left
    function: '새로운 구역 그룹 추가'

  - id: canvas-2d
    type: canvas
    position: main
    function: '2D Konva.js 평면도: 벽, 좌석, 구역, 회의실 편집'
    data_source:
      resource: office_layout

  - id: zoom-controls
    type: toolbar
    position: main
    function: '캔버스 확대/축소, 좌표 정보 패널'

  - id: properties-panel
    type: panel
    position: right
    function: '선택 요소의 id, name, type, color, coords, team_zone_id, assigned_user_id 편집'

  - id: validation-checklist
    type: panel
    position: right
    function: '서버(FastAPI) 정밀 검증 결과(D12): 좌석-벽 충돌, 문 개구부(doors) 존재, 도달성(A*), 구역 범위, 휠체어 경로, 회의실 용량 — ERROR/WARNING 구분 표시'

  - id: version-history
    type: list
    position: bottom
    function: '버전 히스토리: draft/validated/deployed/archived 상태 관리, 배포/롤백 버튼'

events:
  - on: "팔레트 도구 선택"
    do: "해당 도구 하이라이트, 캔버스 마우스 이벤트 리스너 변경"

  - on: "캔버스 좌클릭 + 드래그"
    do: "선택된 도구에 따라 요소 생성 또는 편집(Desk, Wall, Zone Paint 등)"

  - on: "캔버스 요소 선택"
    do: "요소 하이라이트, 우측 properties-panel에 속성 표시"

  - on: "Undo 클릭"
    do: "이전 상태로 복원, canvas 리렌더링"

  - on: "Redo 클릭"
    do: "다음 상태로 복원, canvas 리렌더링"

  - on: "Save 버튼 클릭"
    do: "office_layout.json 직렬화(05 루트 스키마로 재조립), draft 저장, 서버(FastAPI) 정밀 검증 실행, validation-checklist에 ERROR/WARNING 표시(D12)"

  - on: "[데스크톱에서 열기(draft)] 클릭"
    do: "저장된 draft layout_id를 Godot 데스크톱 클라이언트 draft 모드로 열기(딥링크/프로토콜 호출, 본인만 열람 — D11)"

  - on: "Layer 체크박스 토글"
    do: "해당 레이어 요소 표시/숨김, canvas 리렌더링"

  - on: "Properties Panel 값 변경"
    do: "선택 요소의 속성 업데이트, canvas 실시간 리렌더링"

  - on: "버전 히스토리에서 배포 버튼"
    do: "office_layout.status를 'deployed'로 변경, validated_by 기록, deployment_notes 저장, 3D 클라이언트 푸시"

  - on: "버전 히스토리에서 롤백 버튼"
    do: "이전 deployed 버전 선택, 새 office_layout 생성(archived 마크), 3D 클라이언트 동기화"

tests:
  - name: "2D 편집 기본: 좌석 추가 및 팀 구역 할당"
    when: "사용자가 팔레트에서 'Desk' 도구를 선택 후 캔버스에 드래그하여 좌석을 생성하고, 선택하여 우측 패널에서 team_zone_id를 변경"
    then:
      - office_layout.json의 elements 배열에 새 좌석 객체(kind: seat, seat_id, coords, team_zone_id) 추가됨
      - 우측 properties-panel이 해당 좌석의 id, name, team_zone_id, coords, status 표시
      - 레이어 패널의 Seats 개수 증가

  - name: "검증 실패(ERROR): 좌석-벽 충돌 감지 시 배포 차단 (D12)"
    when: "좌석이 벽과 겹치도록 배치되고 Save 버튼 클릭 → 서버 정밀 검증에서 ERROR 반환"
    then:
      - validation-checklist 패널에 'ERROR (X) — 배포 불가' 섹션 표시
      - 오류 메시지 '좌석 3개가 콜리전과 겹침 (S_105 등)' 표시
      - 캔버스에서 겹친 좌석이 빨간색(#FF0000) 하이라이트로 표시
      - 배포 버튼 비활성화('[무시하고 배포]' 버튼 없음), '[2D로 수정]'만 제공
      - draft 저장 자체는 유지됨(수정 후 재검증 가능)

  - name: "검증 통과(WARNING-only): 경고만 있으면 배포 선택 가능 (D12)"
    when: "서버 검증 결과 ERROR 0건, WARNING 2건(휠체어 경로 우회 필요 등)인 상태에서 배포 화면 진입"
    then:
      - validation-checklist에 '검증 결과: ERROR 0 · WARNING 2' 표시
      - WARNING 목록(⚠️) 표시
      - "'[2D로 수정]'과 '[경고 무시하고 배포]' 버튼이 함께 제공됨"
      - "'[경고 무시하고 배포]' 클릭 시 office_layout.status가 deployed로 전환되고 audit_log 기록"

  - name: "레이어 관리: Walls 레이어 토글"
    when: "좌측 Layers 패널에서 'Walls' 체크박스를 언체크"
    then:
      - 캔버스(canvas-2d)의 모든 wall 요소(kind: collider)가 숨겨짐
      - 다른 레이어 Zones, Seats, Rooms은 여전히 표시됨
      - 체크박스를 다시 클릭하면 벽이 재표시됨

  - name: "버전 관리: Draft에서 Validated로 전환"
    when: "현재 office_layout.status가 'draft'이고, 검증 통과 후 '검증' 버튼 클릭"
    then:
      - office_layout.status가 'validated'로 변경
      - office_layout.validated_by에 현재 사용자(erp_user.id) 기록
      - 버전 히스토리 리스트에 새 항목 추가(version, timestamp, status)
      - "'배포' 버튼 활성화, '2D 수정' 버튼 옵션 유지"
      - validation-checklist에 '✓ 검증 통과' 메시지 표시

notes:
  - Konva.js v8.0+ 필수 (2D 캔버스 렌더링, 마우스 이벤트, 변환 행렬)
  - 웹 3D 미리보기는 전면 제거(D11) — 정밀 3D 확인은 저장 후 '[데스크톱에서 열기(draft)]'로 Godot 데스크톱 클라이언트 draft 모드에서 수행
  - office_layout.json 구조는 05-office-layout-schema.md 참조
  - 검증 책임(D12) — 웹 편집기는 경량 체크(좌표 범위/겹침)만 즉시 표시, 도달성(A*) 포함 정밀 검증은 서버(FastAPI) 단독 수행. ERROR 1건 이상이면 배포 버튼 비활성
  - 모든 편집 액션(create/update/delete)에 Undo/Redo 스택 적용
  - 자동저장(auto-save) 권장: 5초 무입력 후 draft 상태로 저장
  - floor.minimap_config 캐시를 초기 로드 시 참조하여 레이아웃 기본값 제공
  - room 생성 시 floor_id, type, capacity, coords 필수
  - team_zone 생성 시 erp_team_id, org_group_id, zone_label, color, polygon 필수
  - 배포/롤백 시 audit_log(action=layout_deployed/layout_rolled_back) 기록은 서버측 교차관심사(자동)로 처리

open_questions:
  - 저장 좌표는 미터(원점 top_left, 05 정본)로 변환 — canvas_px.pixels_per_meter 기본값 정책은?
  - 검증 규칙 중 "휠체어 경로(wheelchair_path)"의 최소 통로 너비 명세? (A* 도달성은 서버 전용 — D12)
  - office_layout.json의 elements 배열 대량 처리(1000+ 좌석) 시 canvas 성능 임계값은?
  - "'[데스크톱에서 열기(draft)]'의 실행 방식: 커스텀 URL 프로토콜(딥링크) vs 수동 안내?"
  - deployment_notes 텍스트 입력 UI는 어디에 위치? (Save 전 모달? 별도 폼?)
