# coturn.local.conf — 로컬 개발 전용 STUN/TURN 설정 (docker-compose.local.yml 경유)
# 목적: 로컬 브라우저 WebRTC P2P ICE 후보 릴레이 검증 (미디어 릴레이는 프로덕션 이관).
# ⚠️ 커밋 허용 — 시크릿은 로컬 전용 평문 값 사용 (프로덕션 coturn.conf와 별개).
# 프로덕션: config/coturn.conf (공인 IP + Let's Encrypt TLS + TURN_STATIC_AUTH_SECRET .env)
#
# 브라우저 접속: turn:localhost:3478 (Rancher Desktop이 3478 포트 호스트 게시)
# 컨테이너 내부: turn:coturn:3478 (Docker DNS)

# ── 리스닝 포트 ──────────────────────────────────────────────────────────────
# TLS(5349) 없음 — 로컬 HTTP 전용 (localhost = secure context)
listening-port=3478

# ── 바인딩 ──────────────────────────────────────────────────────────────────
# 0.0.0.0: Docker 브리지 인터페이스 전체 바인딩
listening-ip=0.0.0.0

# ── 네트워크 — Realm ────────────────────────────────────────────────────────
realm=localhost

# ── 인증 — 정적 시크릿 방식 (HMAC-SHA1 시간 제한 자격증명) ──────────────────
# wa-back의 TURN_STATIC_AUTH_SECRET 값과 반드시 동일해야 함.
# 로컬 전용 평문 값 — 프로덕션에서는 .env 주입 사용.
use-auth-secret
static-auth-secret=local-dev-coturn-secret

# ── 릴레이 UDP 포트 범위 ──────────────────────────────────────────────────────
# docker-compose.local.yml의 포트 매핑과 일치 (50100-50200).
min-port=50100
max-port=50200

# ── 보안 — 프라이빗 IP 릴레이 차단 (SSRF 방지) ───────────────────────────────
# 로컬 개발: Docker 브리지(172.x)와의 충돌 방지를 위해 퍼블릭 차단만 유지.
# 컨테이너 네트워크 172.16-31 차단은 coturn 자체 동작에 영향을 줄 수 있으므로 주석 처리.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
# 프로덕션에서는 아래 추가:
# denied-peer-ip=10.0.0.0-10.255.255.255
# denied-peer-ip=172.16.0.0-172.31.255.255
# denied-peer-ip=192.168.0.0-192.168.255.255

# ── 로깅 ────────────────────────────────────────────────────────────────────
log-file=stdout
no-stdout-log
verbose
