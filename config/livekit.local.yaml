# LiveKit 로컬 개발 전용 설정 (docker-compose.local.yml 경유)
# 목적: 로컬 브라우저에서 LiveKit 토큰 발급·시그널링 검증 (미디어 릴레이는 프로덕션 이관).
# ⚠️ 커밋 허용 (로컬 전용 주석 포함) — 시크릿은 LIVEKIT_KEYS 환경변수로 주입.
#
# 로컬 TLS 제약: localhost:7880 HTTP만 사용 (WSS 미디어 릴레이 없음).
# 프로덕션: config/livekit.yaml (use_external_ip=true + coturn TURN + port_range 방화벽 개방).

# HTTP API / WebSocket 포트 (Caddy 역방향 프록시 대상)
port: 7880

# RTC (WebRTC 미디어 경로)
rtc:
  tcp_port: 7881
  # 로컬 개발: 외부 IP 불필요 — 루프백으로 충분
  use_external_ip: false
  # UDP 포트 범위: coturn(50100-50200)과 겹치지 않는 범위 사용
  port_range_start: 50000
  port_range_end: 50050

# 로깅
logging:
  level: info
  pion_level: error
