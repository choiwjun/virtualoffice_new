# coturn TURN 서버 설정 — 가상오피스 (D21-r TURN-TLS 폴백)
# 이미지: coturn/coturn:4.6.2
# D26: P2P WebRTC 릴레이 (1:1 근접 버블, 소그룹)
#
# ⚠️ 반드시 변경: REPLACE_WITH_COTURN_STATIC_SECRET → 실제 시크릿
#    (docker-compose .env 파일의 COTURN_STATIC_SECRET 값과 동일하게)
# ⚠️ 반드시 변경: YOUR_PUBLIC_IP → 서버 공인 IP

# ── 리스닝 포트 ──────────────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349
# D21-r "TURN-TLS 443 폴백": 보조 IP가 있거나 sslh를 사용하는 경우
# 아래 주석 해제 후 alt-tls-listening-port=443 로 변경
# alt-tls-listening-port=443

# ── 네트워크 ─────────────────────────────────────────────────────────
# 서버 공인 IP (NAT 환경에서 필수 — 수동 입력)
# external-ip=YOUR_PUBLIC_IP
# 내부 IP (Docker 브리지 IP, 자동 감지 허용 시 주석 유지)
# listening-ip=0.0.0.0

# ── 인증 — 정적 시크릿 방식 (시간 제한 토큰, 보안 권장) ──────────────
use-auth-secret
static-auth-secret=REPLACE_WITH_COTURN_STATIC_SECRET
# 위 값을 COTURN_STATIC_SECRET .env 값으로 교체 후 컨테이너 재기동

# ── TLS 인증서 (5349 포트 활성화 시 필수) ────────────────────────────
# Caddy가 /data/caddy/certificates/ 하위에 인증서를 저장하므로
# caddy_data 볼륨을 읽기 전용으로 마운트해 공유 가능.
# 아래 경로는 Let's Encrypt + Caddy 기본 경로; 도메인에 맞게 수정.
# cert=/caddy_data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/DOMAIN/DOMAIN.crt
# pkey=/caddy_data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/DOMAIN/DOMAIN.key

# ── 보안: 프라이빗 IP 릴레이 차단 ────────────────────────────────────
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# ── 릴레이 스레드 (동시 20명 도그푸딩 기준 기본값으로 충분) ───────────
# relay-threads=4

# ── 로깅 ─────────────────────────────────────────────────────────────
log-file=stdout
no-stdout-log
verbose
