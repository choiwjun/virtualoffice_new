# docker-compose.local.yml — 로컬 확인 전용 (커밋/배포 대상 아님)
# 목적: FastAPI 백엔드 + LiveKit(회의 미디어) + coturn(TURN 폴백) 로컬 실증.
# 프로덕션 docker-compose.yml(공개 도메인+Let's Encrypt+LiveKit+coturn)과 별개.
#
# D27/D28: WorkAdventure 외부앱/OIDC/TMJ맵 스택 폐기(2026-07-12 wa-*·caddy 서비스 제거).
#   실시간 3D는 앱 내 Next.js R3F + Colyseus 이동서버(`realtime/`, 포트 2567)로 대체.
#   Colyseus는 아직 Dockerfile 미작성 → 로컬은 `cd realtime && npm start`로 별도 기동.
#
# 기동(Rancher Desktop, WSL):
#   DEXE="/mnt/c/Users/wj941/AppData/Local/Programs/Rancher Desktop/resources/resources/win32/bin/docker.exe"
#   "$DEXE" compose -f docker-compose.local.yml up -d
# 접속: http://localhost:8000 (백엔드), 프론트는 `cd frontend && npm run dev`(localhost:3000)

services:

  # ── FastAPI 백엔드 (presence·KPI·회의 등 도메인 API) ─────────────
  backend:
    build: ./backend
    container_name: volocal_backend
    restart: unless-stopped
    environment:
      # SQLite로 로컬 실증 (프로덕션은 PostgreSQL+asyncpg)
      DATABASE_URL: sqlite+aiosqlite:////data/dev.db
      AUTO_CREATE_TABLES: "true"
      JWT_SECRET_KEY: local-dev-jwt-secret-not-for-production
      ENVIRONMENT: development
      # LiveKit 자격증명 (C3: 회의실 livekit-token 발급용 — /api/meetings/{id}/livekit-token 예정)
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: "devsecret01234567890123456789012345"
      LIVEKIT_URL: "http://livekit:7880"
      # 앱 오리진만 허용 (프론트 dev 서버). Colyseus 클라 배선 시 필요분 추가.
      CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      # SQLite 파일 영속화 (컨테이너 재기동 시 데이터 유지)
      - backend_sqlite:/data
    ports:
      - "127.0.0.1:8000:8000"

  # ── LiveKit SFU (D24: 명시적 입장 토큰 발급, 로컬 시그널링 검증) ──────────
  # 로컬 TLS 제약으로 미디어 릴레이 없음; 토큰 발급·WebSocket 시그널링만 검증.
  # 프로덕션: docker-compose.yml의 livekit 서비스에서 외부 IP + coturn 사용.
  livekit:
    image: livekit/livekit-server:v1.7.2
    container_name: volocal_livekit
    restart: unless-stopped
    command: --config /etc/livekit/livekit.local.yaml --bind 0.0.0.0
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      # RTC UDP (livekit.local.yaml port_range 50000-50050와 정합 — 미매핑 시 ICE가
      # TCP 7881 폴백에만 의존해 연결 플래핑, 2026-07-17 실측)
      - "127.0.0.1:50000-50050:50000-50050/udp"
    environment:
      # LIVEKIT_KEYS 형식: "<api_key>: <api_secret>"
      LIVEKIT_KEYS: "devkey: devsecret01234567890123456789012345"
    volumes:
      - ./config/livekit.local.yaml:/etc/livekit/livekit.local.yaml:ro

  # ── coturn STUN/TURN (로컬, D21-r TURN 폴백 검증) ────────────────────────
  # 목적: 브라우저 WebRTC ICE 후보 릴레이 검증 (로컬 단일 머신, NAT 없음).
  # 프로덕션 실WAN 미디어 릴레이(공인 IP + TLS 5349)는 docker-compose.yml 이관 명시.
  coturn:
    image: coturn/coturn:4.6.2
    container_name: volocal_coturn
    restart: unless-stopped
    ports:
      - "127.0.0.1:3478:3478/tcp"
      - "127.0.0.1:3478:3478/udp"
      - "127.0.0.1:50100-50200:50100-50200/udp"
    volumes:
      - ./config/coturn.local.conf:/etc/coturn/turnserver.conf:ro
    command: -c /etc/coturn/turnserver.conf

volumes:
  backend_sqlite:
